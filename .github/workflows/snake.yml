name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Gaurav-giradkar
          outputs: output/github-contribution-grid-snake.svg

      - name: Commit generated snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update contribution snake"
          add: "output/github-contribution-grid-snake.svg"