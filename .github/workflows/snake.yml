name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Gaurav-giradkar
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=#39D353&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push