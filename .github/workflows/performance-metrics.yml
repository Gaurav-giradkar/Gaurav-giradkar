name: Update Performance Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Gaurav-giradkar
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from collections import Counter

          USERNAME = os.environ["USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "performance-metrics"
          }

          def api(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          # -----------------------------
          # USER
          # -----------------------------

          user = api(f"https://api.github.com/users/{USERNAME}")

          # -----------------------------
          # REPOSITORIES
          # -----------------------------

          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          repository_count = len(repos)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          # -----------------------------
          # REAL LANGUAGE BYTES
          # -----------------------------

          language_bytes = Counter()

          for repo in repos:
              owner = repo["owner"]["login"]
              name = repo["name"]

              try:
                  data = api(
                      f"https://api.github.com/repos/"
                      f"{owner}/{name}/languages"
                  )

                  for language, amount in data.items():
                      language_bytes[language] += amount

              except Exception:
                  pass

          total_bytes = sum(language_bytes.values()) or 1

          top_languages = language_bytes.most_common(6)

          # -----------------------------
          # CONTRIBUTIONS
          # -----------------------------

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoryContributions
                restrictedContributionsCount
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": USERNAME
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  **HEADERS,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          contributions = result["data"]["user"]["contributionsCollection"]

          commits = contributions["totalCommitContributions"]
          pull_requests = contributions["totalPullRequestContributions"]
          issues = contributions["totalIssueContributions"]

          total_contributions = (
              commits
              + pull_requests
              + issues
              + contributions["totalRepositoryContributions"]
              + contributions["restrictedContributionsCount"]
          )

          # -----------------------------
          # SVG
          # -----------------------------

          width = 900
          height = 520

          bg = "#111827"
          border = "#273244"
          text = "#F9FAFB"
          muted = "#9CA3AF"
          cyan = "#22D3EE"
          green = "#22C55E"

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}">

          <rect
            width="900"
            height="520"
            rx="14"
            fill="{bg}"/>

          <rect
            x="1"
            y="1"
            width="898"
            height="518"
            rx="13"
            fill="none"
            stroke="{border}"/>

          <text
            x="32"
            y="42"
            fill="{text}"
            font-family="monospace"
            font-size="22"
            font-weight="700">
            PERFORMANCE METRICS
          </text>

          <line
            x1="32"
            y1="62"
            x2="868"
            y2="62"
            stroke="{border}"/>

          <!-- GITHUB ACTIVITY -->

          <text
            x="32"
            y="98"
            fill="{cyan}"
            font-family="monospace"
            font-size="16"
            font-weight="700">
            GITHUB ACTIVITY
          </text>

          <text x="32" y="135"
            fill="{muted}"
            font-family="monospace"
            font-size="13">
            COMMITS
          </text>

          <text x="210" y="135"
            fill="{text}"
            font-family="monospace"
            font-size="15"
            font-weight="700">
            {commits}
          </text>

          <text x="32" y="168"
            fill="{muted}"
            font-family="monospace"
            font-size="13">
            REPOSITORIES
          </text>

          <text x="210" y="168"
            fill="{text}"
            font-family="monospace"
            font-size="15"
            font-weight="700">
            {repository_count}
          </text>

          <text x="32" y="201"
            fill="{muted}"
            font-family="monospace"
            font-size="13">
            PULL REQUESTS
          </text>

          <text x="210" y="201"
            fill="{text}"
            font-family="monospace"
            font-size="15"
            font-weight="700">
            {pull_requests}
          </text>

          <text x="32" y="234"
            fill="{muted}"
            font-family="monospace"
            font-size="13">
            ISSUES
          </text>

          <text x="210" y="234"
            fill="{text}"
            font-family="monospace"
            font-size="15"
            font-weight="700">
            {issues}
          </text>

          <text x="32" y="267"
            fill="{muted}"
            font-family="monospace"
            font-size="13">
            STARS
          </text>

          <text x="210" y="267"
            fill="{text}"
            font-family="monospace"
            font-size="15"
            font-weight="700">
            {stars}
          </text>

          <!-- CONTRIBUTIONS -->

          <line
            x1="290"
            y1="90"
            x2="290"
            y2="285"
            stroke="{border}"/>

          <text
            x="325"
            y="98"
            fill="{cyan}"
            font-family="monospace"
            font-size="16"
            font-weight="700">
            CONTRIBUTIONS
          </text>

          <text
            x="325"
            y="150"
            fill="{text}"
            font-family="monospace"
            font-size="40"
            font-weight="700">
            {total_contributions}
          </text>

          <text
            x="325"
            y="175"
            fill="{muted}"
            font-family="monospace"
            font-size="11">
            THIS YEAR
          </text>

          <!-- CURRENT FOCUS -->

          <line
            x1="540"
            y1="90"
            x2="540"
            y2="285"
            stroke="{border}"/>

          <text
            x="575"
            y="98"
            fill="{cyan}"
            font-family="monospace"
            font-size="16"
            font-weight="700">
            CURRENT FOCUS
          </text>

          <text x="575" y="140"
            fill="{text}"
            font-family="monospace"
            font-size="14">
            01  AI SYSTEMS
          </text>

          <text x="575" y="175"
            fill="{text}"
            font-family="monospace"
            font-size="14">
            02  SOFTWARE
          </text>

          <text x="575" y="210"
            fill="{text}"
            font-family="monospace"
            font-size="14">
            03  PRODUCT
          </text>

          <text x="575" y="245"
            fill="{text}"
            font-family="monospace"
            font-size="14">
            04  DESIGN
          </text>

          <!-- LANGUAGES -->

          <line
            x1="32"
            y1="305"
            x2="868"
            y2="305"
            stroke="{border}"/>

          <text
            x="32"
            y="338"
            fill="{cyan}"
            font-family="monospace"
            font-size="16"
            font-weight="700">
            MOST USED TECHNOLOGIES
          </text>
          '''

          # Stack languages vertically

          y = 370

          for language, amount in top_languages:

              percentage = (amount / total_bytes) * 100

              bar_width = max(3, 500 * percentage / 100)

              svg += f'''
              <text
                x="32"
                y="{y}"
                fill="{muted}"
                font-family="monospace"
                font-size="12">
                {language.upper()}
              </text>

              <rect
                x="180"
                y="{y - 10}"
                width="500"
                height="8"
                rx="4"
                fill="#1F2937"/>

              <rect
                x="180"
                y="{y - 10}"
                width="{bar_width}"
                height="8"
                rx="4"
                fill="{green}"/>

              <text
                x="710"
                y="{y}"
                fill="{text}"
                font-family="monospace"
                font-size="12"
                font-weight="700">
                {percentage:.2f}%
              '''
              svg += "</text>"

              y += 25

          svg += '''
          </svg>
          '''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/performance-metrics.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Live performance metrics generated.")
          PY

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/performance-metrics.svg

          git diff --cached --quiet || \
            git commit -m "Update live performance metrics"

          git push